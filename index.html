<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Porto City Break — Interactive Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">

<style>
:root{--bg:#12141a;--panel:#1b1e27;--ink:#eef1f7;--mut:#98a0b3;--line:#2b3040}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
#app{display:flex;height:100%;overflow:hidden}
#side{width:350px;flex:0 0 350px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:1000}
#side h1{font-size:16px;margin:0;padding:16px 16px 4px}
#side .sub{font-size:11.5px;color:var(--mut);padding:0 16px 12px}
#search{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:#0e1015;color:var(--ink);font-size:13px;outline:none}
.searchwrap{padding:0 16px 10px}
.filters{padding:0 16px 8px;display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 9px;border-radius:20px;border:1px solid var(--line);cursor:pointer;user-select:none;opacity:.45;transition:.15s}
.chip.on{opacity:1;background:#0e1015}
.dot{width:8px;height:8px;border-radius:50%}
.itins{padding:0 16px 10px;display:flex;gap:6px;flex-wrap:wrap}
.itin{font-size:11.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#0e1015;color:var(--ink);cursor:pointer}
.itin.on{background:#2f6bff;border-color:#2f6bff}
.ovl{padding:0 16px 10px;display:flex;gap:6px;flex-wrap:wrap}
.ov{font-size:11.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#0e1015;color:var(--ink);cursor:pointer;opacity:.5}
.ov.on{opacity:1;border-color:#3a7f5f}
#list{flex:1;overflow-y:auto;border-top:1px solid var(--line)}
.item{padding:9px 16px;border-bottom:1px solid #222736;cursor:pointer;font-size:13px;display:flex;gap:9px;align-items:flex-start}
.item:hover{background:#222736}
.n{font-size:10.5px;min-width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:0 0 20px}
.item .meta{font-size:10.5px;color:var(--mut);margin-top:2px}
.item img.th{width:44px;height:44px;border-radius:7px;object-fit:cover;flex:0 0 44px;background:#0e1015}
#map{flex:1;height:100%}
.count{font-size:11px;color:var(--mut);padding:8px 16px;border-top:1px solid var(--line)}
.mk{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;border-radius:50%;width:22px;height:22px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.mk.approx{border-style:dashed}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:12px}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:10px 12px}
.pop h3{margin:0 0 3px;font-size:14px}
.pop .a{font-size:11px;color:var(--mut);margin-bottom:8px}
.pop a.btn{display:inline-block;font-size:11.5px;padding:5px 9px;border-radius:7px;background:#2f6bff;color:#fff;text-decoration:none;margin-right:6px}
.pop a.btn.alt{background:#2b3040}
.pop .warn{font-size:10.5px;color:#e0a030;margin-top:6px}
.pop .line{font-size:11.5px;color:#c9d1e0;margin:3px 0}
.pop .line b{color:#8fa2c4;font-weight:600}
.nearbtn{width:100%;margin-top:8px;padding:8px;border-radius:9px;border:1px solid var(--line);
 background:#0e1015;color:var(--ink);font-size:12.5px;cursor:pointer}
.nearbtn.on{background:#2f6bff;border-color:#2f6bff}
.gal{display:flex;gap:5px;overflow-x:auto;margin:0 0 9px;padding-bottom:3px}
.gal img{height:104px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:#0e1015}
.gal::-webkit-scrollbar{height:5px}
.gal::-webkit-scrollbar-thumb{background:#3a4152;border-radius:3px}
.cred{font-size:9.5px;color:#6c7488;margin-top:7px}
.hp{font-size:11.5px;line-height:1.55}
.hp .tag{display:inline-block;font-size:9.5px;padding:2px 6px;border-radius:5px;margin-bottom:5px}
.tag.cert{background:#1e6b3a;color:#d6ffe4}
.tag.friend{background:#5c4a12;color:#ffe9b0}
.mkwrap{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.clwrap{background:none;border:none}
.cl{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;color:#fff;background:rgba(47,107,255,.92);
  border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.55)}
.gal img{cursor:zoom-in;touch-action:manipulation}
#lb{position:fixed;inset:0;z-index:5000;display:none;flex-direction:column;
  background:rgba(6,8,12,.985);
  padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px))}
#lb.on{display:flex}
#lb .lbbar{display:flex;align-items:center;gap:10px;padding:2px 4px 8px;min-height:36px}
#lb .lbname{font-size:12.5px;color:#c9d1e0;flex:1;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
#lb .lbcnt{font-size:11.5px;color:#8b93a7;font-variant-numeric:tabular-nums}
#lb button{border:none;background:rgba(255,255,255,.09);color:#eef1f7;border-radius:10px;
  width:38px;height:38px;font-size:17px;line-height:1;cursor:pointer;flex:0 0 38px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#lb button:active{background:rgba(255,255,255,.2)}
#lb .stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;
  transition:transform .15s ease-out,opacity .12s;will-change:transform;
  -webkit-user-select:none;user-select:none;-webkit-user-drag:none;cursor:zoom-in}
#lb img.zoomed{cursor:grab;transition:transform .05s linear}
#lb img.dragging{cursor:grabbing}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;
  background:rgba(12,15,22,.65)}
#lb .nav.prev{left:2px}#lb .nav.next{right:2px}
#lb .cap{font-size:10.5px;color:#6c7488;padding:6px 6px 0;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fading{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent)}
#mnav{display:none}
/* ================= MOBILE ================= */
@media(max-width:760px){
 html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
 #app{display:block;position:relative;height:100vh;height:100dvh}
 #map{position:absolute;inset:0;height:100%;z-index:1}
 #side{position:absolute;left:0;right:0;top:0;bottom:0;width:auto;flex:none;max-height:none;
   border-right:none;border-bottom:none;background:var(--panel);z-index:1100;display:none;
   padding-bottom:calc(58px + env(safe-area-inset-bottom,0px))}
 body.listmode #side{display:flex}
 body.mapmode #side{display:flex;bottom:auto;height:auto;max-height:100%;background:transparent;
   padding-bottom:0;pointer-events:none}
 body.mapmode #side .topwrap{pointer-events:auto;margin:8px;border-radius:14px;
   background:rgba(27,30,39,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
   border:1px solid var(--line);box-shadow:0 8px 26px rgba(0,0,0,.5)}
 body.mapmode #side .topwrap ~ *{display:none!important}
 #side h1{font-size:15px;padding:10px 12px 2px}
 #side .sub{font-size:10.5px;padding:0 12px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .searchwrap{padding:0 12px 8px;display:flex;gap:6px;flex-wrap:wrap}
 #search{font-size:16px;padding:10px 12px;border-radius:10px;flex:1 1 140px;min-width:0}
 .nearbtn{width:auto;flex:0 1 auto;margin-top:0;padding:0 12px;min-height:40px;font-size:12px;
   white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
 .filters{padding:0 12px 10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
   -webkit-overflow-scrolling:touch}
 .filters::-webkit-scrollbar{display:none}
 .chip{padding:8px 12px;font-size:12px;flex:0 0 auto;white-space:nowrap}
 .itins,.ovl{padding:0 12px 10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
   -webkit-overflow-scrolling:touch}
 .itins::-webkit-scrollbar,.ovl::-webkit-scrollbar{display:none}
 .itin,.ov{flex:0 0 auto;padding:10px 13px;font-size:12px}
 .item{padding:12px;gap:10px}
 .item img.th{width:54px;height:54px;flex:0 0 54px}
 .item>div>div:first-child{font-size:14px;line-height:1.3}
 .count{font-size:10.5px;padding:8px 12px}
 .pop .gal img{height:82px}
 .pop h3{font-size:15px}
 .leaflet-popup-content{margin:9px 10px;max-width:calc(100vw - 56px)!important}
 .leaflet-bottom{bottom:calc(64px + env(safe-area-inset-bottom,0px))!important}
 .leaflet-control-attribution{font-size:8.5px}
 #mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:1300;
   height:calc(58px + env(safe-area-inset-bottom,0px));
   padding:0 8px env(safe-area-inset-bottom,0px);align-items:center;gap:8px;
   background:rgba(20,23,30,.97);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
   border-top:1px solid var(--line)}
 #mnav button{flex:1;height:44px;border-radius:11px;border:1px solid var(--line);
   background:#0e1015;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;
   touch-action:manipulation;-webkit-tap-highlight-color:transparent}
 #mnav button.on{background:#2f6bff;border-color:#2f6bff;color:#fff}
}

</style></head><body>
<div id="app">
 <div id="side">
  <div class="topwrap">
   <h1>Porto City Break</h1>
   <div class="sub">111 destinations · 83 with photos · official Visit Porto guide</div>
   <div class="searchwrap"><input id="search" placeholder="Search a place…" autocomplete="off" enterkeyhint="search">
     <button id="nearme" class="nearbtn">📍 Near me</button></div>
   <div class="filters" id="filters"></div>
  </div>
  <div class="itins" id="itins"></div>
  <div class="ovl" id="ovl"></div>
  <div id="list"></div>
  <div class="count" id="count"></div>
 </div>
 <div id="map"></div>
 <div id="lb" aria-hidden="true" role="dialog" aria-label="Photo viewer">
  <div class="lbbar">
   <span class="lbname" id="lb-name"></span>
   <span class="lbcnt" id="lb-cnt"></span>
   <button id="lb-x" aria-label="Close">✕</button>
  </div>
  <div class="stage" id="lb-stage">
   <img id="lb-img" alt="">
   <button class="nav prev" id="lb-prev" aria-label="Previous photo">‹</button>
   <button class="nav next" id="lb-next" aria-label="Next photo">›</button>
  </div>
  <div class="cap" id="lb-cap"></div>
 </div>
 <nav id="mnav">
  <button data-mode="map" class="on">🗺 Map</button>
  <button data-mode="list">📋 List</button>
 </nav>
</div>

const IS_MOBILE=()=>window.innerWidth<=760;
// keep popups clear of the floating search card (top) and the tab bar (bottom)
const PAD_TL=()=>IS_MOBILE()?[18,170]:[12,12];
const PAD_BR=()=>IS_MOBILE()?[18,86]:[12,12];
const map = L.map('map',{zoomControl:false}).setView([41.1520,-8.6200],13);
L.control.zoom({position:IS_MOBILE()?'bottomright':'topleft'}).addTo(map);
// tile.openstreetmap.org 403s unless a Referer is sent (i.e. only works off http(s)).
// CARTO returns an "API KEY REQUIRED" watermark with HTTP 200. Esri is keyless and works.
const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services";
const ATTR='Tiles &copy; Esri &mdash; Esri, HERE, Garmin, OpenStreetMap contributors';
const STREET=L.tileLayer(ESRI+'/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:ATTR}).addTo(map);
const TOPO=L.tileLayer(ESRI+'/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:ATTR});
const SAT=L.tileLayer(ESRI+'/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:ATTR});
const OSM=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});

const cluster=L.markerClusterGroup?L.markerClusterGroup({
  maxClusterRadius:IS_MOBILE()?46:58, showCoverageOnHover:false,
  spiderfyOnMaxZoom:true, disableClusteringAtZoom:17,
  iconCreateFunction:c=>L.divIcon({html:'<div class="cl">'+c.getChildCount()+'</div>',
    className:'clwrap', iconSize:[38,38]})}):null;
if(cluster) map.addLayer(cluster);
const halalLayer=L.layerGroup().addTo(map);
const superLayer=L.layerGroup();

DATA.halal.forEach(p=>{
  const cert=p.kind==='halal_certified';
  L.circleMarker([p.lat,p.lon],{radius:6,color:cert?'#2ecc71':'#e0a030',weight:2,
     fillColor:cert?'#1e6b3a':'#5c4a12',fillOpacity:.9})
   .bindPopup(`<div class="pop hp">
     <span class="tag ${cert?'cert':'friend'}">${cert?'HALAL ✓ tagged':'halal-friendly · not certified'}</span>
     <h3>${p.name}</h3>
     <div class="a">${[p.cuisine&&('cuisine: '+p.cuisine),p.addr,p.opening].filter(Boolean).join(' · ')||'food'}</div>
     <a class="btn alt" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank" rel="noopener">Directions</a>
   </div>`).addTo(halalLayer);
});
DATA.supers.forEach(p=>{
  L.circleMarker([p.lat,p.lon],{radius:5,color:'#4da3ff',weight:1.5,fillColor:'#1f6feb',fillOpacity:.75})
   .bindPopup(`<div class="pop hp"><h3>${p.name}</h3>
     <div class="a">${[p.brand,p.addr,p.opening].filter(Boolean).join(' · ')||'supermarket'}</div>
     <a class="btn alt" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank" rel="noopener">Directions</a></div>`)
   .addTo(superLayer);
});

const baseLayers={'Street map (Esri)':STREET,'Topographic (Esri)':TOPO,'Satellite (Esri)':SAT};
if(location.protocol.startsWith('http')) baseLayers['OpenStreetMap']=OSM;
L.control.layers(baseLayers,{
  ['Halal food ('+DATA.halal.length+')']:halalLayer,
  ['Supermarkets ('+DATA.supers.length+')']:superLayer
},{position:IS_MOBILE()?'bottomright':'topright',collapsed:true}).addTo(map);

const active=new Set(Object.keys(DATA.colors));
let query='',itinLine=null,activeItin=null;
const markers=[];
const fbox=document.getElementById('filters');
Object.entries(DATA.colors).forEach(([area,col])=>{
  const c=document.createElement('div'); c.className='chip on'; c.dataset.area=area;
  c.innerHTML=`<span class="dot" style="background:${col}"></span>${DATA.icons[area]} ${area.split(' ')[0]}`;
  c.onclick=()=>{ if(active.has(area)){active.delete(area);c.classList.remove('on');}
                  else{active.add(area);c.classList.add('on');} render(); };
  fbox.appendChild(c);
});
const ibox=document.getElementById('itins');
Object.keys(DATA.itins).forEach(d=>{
  const b=document.createElement('button'); b.className='itin'; b.textContent=d;
  b.onclick=()=>{
    document.querySelectorAll('.itin').forEach(x=>x.classList.remove('on'));
    if(activeItin===d){activeItin=null;if(itinLine){map.removeLayer(itinLine);itinLine=null;}}
    else{activeItin=d;b.classList.add('on');drawItin(d);}
  };
  ibox.appendChild(b);
});
const obox=document.getElementById('ovl');
[['Halal food',halalLayer,'#2ecc71'],['Supermarkets',superLayer,'#4da3ff']].forEach(([lbl,layer,c])=>{
  const b=document.createElement('button'); b.className='ov on'; b.textContent=lbl;
  b.onclick=()=>{ if(map.hasLayer(layer)){map.removeLayer(layer);b.classList.remove('on');}
                  else{map.addLayer(layer);b.classList.add('on');} };
  obox.appendChild(b);
});
function drawItin(d){
  if(itinLine){map.removeLayer(itinLine);itinLine=null;}
  const pts=DATA.itins[d].map(n=>DATA.pois.find(p=>p.name===n)).filter(Boolean).map(p=>[p.lat,p.lon]);
  if(pts.length>1){itinLine=L.polyline(pts,{color:'#2f6bff',weight:4,opacity:.85,dashArray:'9 7'}).addTo(map);
    map.fitBounds(itinLine.getBounds(),{padding:[40,40]});}
}
function popupFor(p){
  const gm=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;
  const gal=p.photos.length?`<div class="gal" data-poi="${escAttr(p.name)}">${p.photos.map((u,i)=>`<img src="${u}" loading="lazy" alt="${escAttr(p.name)}" data-i="${i}" draggable="false">`).join('')}</div>`:'';
  const cred=p.photo_src?`<div class="cred">Photos: ${p.photo_src} (CC)</div>`:'';
  const hours=p.hours?`<div class="line"><b>Hours</b> ${p.hours}</div>`:'';
  const web=p.website?`<div class="line"><a href="${p.website}" target="_blank" rel="noopener">Official site ↗</a></div>`:'';
  const tel=p.phone?`<div class="line">${p.phone}</div>`:'';
  return `<div class="pop">${gal}<h3>${p.name}</h3><div class="a">${p.area}</div>
    ${hours}${tel}${web}
    <a class="btn" href="${gm}" target="_blank" rel="noopener">Directions</a>
    <a class="btn alt" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}" target="_blank" rel="noopener">Google Maps</a>
    ${p.approx?'<div class="warn">Approximate location — verify before walking.</div>':''}${cred}</div>`;
}
let userPos=null;
function hav(a,b){
  const R=6371000,r=Math.PI/180;
  const dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
let meDot=null;
document.getElementById('nearme').onclick=function(){
  const btn=this;
  if(userPos){                                  // second tap resets the sort
    userPos=null; btn.classList.remove('on'); btn.textContent='📍 Near me';
    if(meDot){map.removeLayer(meDot);meDot=null;}
    setMode(IS_MOBILE()?'map':'map'); render(); return;
  }
  if(!navigator.geolocation){alert('Geolocation not supported by this browser.');return;}
  btn.textContent='📍 Locating…'; btn.disabled=true;
  navigator.geolocation.getCurrentPosition(pos=>{
    userPos=[pos.coords.latitude,pos.coords.longitude];
    btn.disabled=false; btn.classList.add('on'); btn.textContent='📍 Sorted by distance';
    meDot=L.circleMarker(userPos,{radius:9,color:'#fff',weight:3,fillColor:'#2f6bff',fillOpacity:1})
      .addTo(map).bindPopup('You are here');
    map.setView(userPos,15);
    if(IS_MOBILE()) setMode('list');
    render();
  },err=>{
    btn.disabled=false; btn.textContent='📍 Near me';
    alert('Could not get your location: '+err.message);
  },{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
};
function render(){
  markers.forEach(m=>{ if(cluster) cluster.removeLayer(m); else map.removeLayer(m); });
  markers.length=0;
  const list=document.getElementById('list'); list.innerHTML='';
  const q=query.trim().toLowerCase(); let shown=0;
  const rows=DATA.pois.filter(p=>{
    if(!active.has(p.area)) return false;
    if(q&&!(p.name.toLowerCase().includes(q)||p.area.toLowerCase().includes(q))) return false;
    return true;
  });
  if(userPos) rows.sort((a,b)=>hav(userPos,[a.lat,a.lon])-hav(userPos,[b.lat,b.lon]));
  rows.forEach(p=>{
    shown++;
    const m=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',iconSize:[36,36],iconAnchor:[18,18],
      html:`<div class="mkwrap"><div class="mk ${p.approx?'approx':''}" style="background:${p.color}">${p.num}</div></div>`})});
    m.bindPopup(popupFor(p),{maxWidth:Math.max(200,Math.min(340,window.innerWidth-56)),
      autoPanPaddingTopLeft:PAD_TL(),autoPanPaddingBottomRight:PAD_BR()});
    if(cluster) cluster.addLayer(m); else m.addTo(map);
    markers.push(m);
    const d=userPos?hav(userPos,[p.lat,p.lon]):null;
    const dstr=d===null?'':` · ${d<950?Math.round(d)+' m':(d/1000).toFixed(1)+' km'}`;
    const it=document.createElement('div'); it.className='item';
    it.innerHTML=`${p.photos.length?`<img class="th" src="${p.photos[0]}" loading="lazy" alt="">`:''}
      <span class="n" style="background:${p.color}">${p.num}</span>
      <div><div>${p.name}</div><div class="meta">${p.area}${p.approx?' · approx':''}${dstr}${p.hours?' · '+p.hours.slice(0,26):''}</div></div>`;
    it.onclick=()=>{
      const go=()=>{
        // instant jump: an animated setView finishes AFTER the popup opens and
        // re-centres it back under the floating card
        map.setView([p.lat,p.lon],Math.max(map.getZoom(),17),{animate:false});
        setTimeout(()=>{
          if(m._map){ m.openPopup(); }
          else{ // marker still inside a cluster: open the popup on the map itself
            map.openPopup(popupFor(p),[p.lat,p.lon],
              {maxWidth:Math.max(200,Math.min(340,window.innerWidth-56)),
               autoPanPaddingTopLeft:PAD_TL(),autoPanPaddingBottomRight:PAD_BR()});
          }
        },80);
      };
      if(IS_MOBILE()){ setMode('map'); setTimeout(go,180); } else go();
    };
    list.appendChild(it);
  });
  document.getElementById('count').textContent=`${shown} of ${DATA.pois.length} shown`+
    (DATA.unmapped.length?` · ${DATA.unmapped.length} not mappable`:'')+
    ` · ${DATA.halal.length} halal · ${DATA.supers.length} supermarkets`;
}
function fadeRows(){
  ['.filters','.itins','.ovl'].forEach(s=>{
    const el=document.querySelector(s); if(!el) return;
    el.classList.toggle('fading', IS_MOBILE() && (el.scrollWidth-el.clientWidth)>4);
  });
}
function setMode(m){
  document.body.classList.toggle('listmode',m==='list');
  document.body.classList.toggle('mapmode',m==='map');
  document.querySelectorAll('#mnav button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  if(m==='map'){setTimeout(()=>map.invalidateSize(),60);}
  if(m==='list'){const l=document.getElementById('list');if(l)l.scrollTop=0;
    setTimeout(()=>map.invalidateSize(),60);}
}
document.querySelectorAll('#mnav button').forEach(b=>{b.onclick=()=>setMode(b.dataset.mode);});
/* ================= image viewer ================= */
function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
const LB=document.getElementById('lb'),LBI=document.getElementById('lb-img'),
      LBN=document.getElementById('lb-name'),LBC=document.getElementById('lb-cnt'),
      LBCAP=document.getElementById('lb-cap'),LBST=document.getElementById('lb-stage');
let lbList=[],lbIdx=0,lbName='',lbCredit='',lbZoom=1,lbPX=0,lbPY=0;
function applyT(){LBI.style.transform=`translate(${lbPX}px,${lbPY}px) scale(${lbZoom})`;}
function setZoom(z){lbZoom=z;if(z<=1){lbPX=0;lbPY=0;}LBI.classList.toggle('zoomed',z>1);applyT();}
function lbPaint(fade){
  const paint=()=>{
    LBI.style.opacity=0;
    setTimeout(()=>{
      LBI.src=lbList[lbIdx];
      LBI.alt=lbName;
      LBN.textContent=lbName;
      LBC.textContent=lbList.length>1?(lbIdx+1)+' / '+lbList.length:'';
      LBCAP.textContent=lbCredit?(lbName+' — '+lbCredit):'';
      LBI.style.opacity=1;
    },fade?90:0);
    setZoom(1);
    [lbIdx-1,lbIdx+1].forEach(k=>{if(lbList[k]){const im=new Image();im.src=lbList[k];}});
  };
  if(fade){LBI.style.opacity=0;setTimeout(paint,90);}else paint();
}
function openLB(name,idx){
  const p=DATA.pois.find(x=>x.name===name);
  if(!p||!p.photos||!p.photos.length) return;
  lbList=p.photos;lbName=p.name;lbCredit=p.photo_src||'';lbIdx=Math.max(0,Math.min(idx||0,lbList.length-1));
  LB.classList.add('on');LB.setAttribute('aria-hidden','false');
  document.getElementById('lb-prev').style.display=lbList.length>1?'':'none';
  document.getElementById('lb-next').style.display=lbList.length>1?'':'none';
  lbPaint(false);
}
function closeLB(){
  LB.classList.remove('on');LB.setAttribute('aria-hidden','true');
  setTimeout(()=>{if(!LB.classList.contains('on')){LBI.removeAttribute('src');LBI.style.transform='';}},200);
  lbZoom=1;lbPX=lbPY=0;
}
function lbGo(d){
  if(lbList.length<2) return;
  lbIdx=(lbIdx+d+lbList.length)%lbList.length;
  setZoom(1);lbPaint(true);
}
document.getElementById('lb-x').onclick=closeLB;
document.getElementById('lb-prev').onclick=e=>{e.stopPropagation();lbGo(-1);};
document.getElementById('lb-next').onclick=e=>{e.stopPropagation();lbGo(1);};
LB.addEventListener('click',e=>{if(e.target===LB||e.target===LBST) closeLB();});
document.addEventListener('click',e=>{
  const img=e.target.closest('.gal img');
  if(!img) return;
  const box=img.closest('.gal');
  openLB(box.dataset.poi,parseInt(img.dataset.i||'0',10));
});
document.addEventListener('keydown',e=>{
  if(!LB.classList.contains('on')) return;
  if(e.key==='Escape'){closeLB();}
  else if(e.key==='ArrowLeft'){lbGo(-1);}
  else if(e.key==='ArrowRight'){lbGo(1);}
  else if(e.key==='+'||e.key==='='){setZoom(lbZoom>1?1:2.4);}
});
/* swipe to change photo, drag to pan when zoomed, double-tap to zoom */
let lbDrag=null,lbLastTap=0;
LBST.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')) return;
  lbDrag={x:e.clientX,y:e.clientY,px:lbPX,py:lbPY,moved:0,zoom:lbZoom};
  LBI.classList.add('dragging');
});
LBST.addEventListener('pointermove',e=>{
  if(!lbDrag) return;
  const dx=e.clientX-lbDrag.x,dy=e.clientY-lbDrag.y;
  lbDrag.moved=Math.max(lbDrag.moved,Math.hypot(dx,dy));
  if(lbDrag.zoom>1){lbPX=lbDrag.px+dx;lbPY=lbDrag.py+dy;applyT();}
  else if(Math.abs(dx)>6){LBI.style.transform=`translateX(${dx*0.3}px)`;}
});
LBST.addEventListener('pointerup',e=>{
  if(!lbDrag) return;
  const d=lbDrag;lbDrag=null;
  LBI.classList.remove('dragging');
  const dx=e.clientX-d.x;
  if(d.zoom>1){ lbPX=d.px;lbPY=d.py;applyT(); if(d.moved<12) setZoom(1); return; }
  LBI.style.transform='';
  if(Math.abs(dx)>55){lbGo(dx<0?1:-1);return;}
  if(d.moved<12){
    const now=Date.now();
    if(now-lbLastTap<330){setZoom(2.4);lbLastTap=0;}else lbLastTap=now;
  }
});
LBST.addEventListener('pointercancel',()=>{lbDrag=null;LBI.classList.remove('dragging');LBI.style.transform='';});

document.getElementById('search').oninput=e=>{query=e.target.value;render();
  if(IS_MOBILE()&&document.body.classList.contains('mapmode')) setMode('list');};
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);
  rzT=setTimeout(()=>{map.invalidateSize();
    if(IS_MOBILE()&&!document.body.classList.contains('listmode')
       &&!document.body.classList.contains('mapmode')) setMode('map');},180);});
window.addEventListener('orientationchange',()=>setTimeout(()=>map.invalidateSize(),350));
setMode(IS_MOBILE()?'map':null);
render();
fadeRows(); window.addEventListener('load',fadeRows);
document.querySelectorAll('.filters,.itins,.ovl').forEach(el=>el.addEventListener('scroll',()=>{
  if(el.scrollLeft>4) el.classList.remove('fading');}, {passive:true}));
setTimeout(()=>map.invalidateSize(),300);
</script></body></html>
